# Builds the single binary and, for a version tag, publishes a GitHub release.
#
# To release: set "version" in package.json, commit, then
#   git tag v1.2.3 && git push origin v1.2.3
#
# Run it by hand (Actions → Release → Run workflow) to build and test
# without releasing; the binary is kept as a workflow artifact.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          # Uncomment for ARM64 if your repository can use GitHub's Arm runners.
          # - target: linux-arm64
          #   runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Node 26 is needed to build the binary (node --build-sea); the binary
      # carries its own Node, so the target machine needs none.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install bubblewrap and ripgrep, so the sandbox and search tests run
        run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap ripgrep

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Work out the version
        id: version
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$pkg" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $pkg. Update package.json and tag again."
              exit 1
            fi
          else
            version="$pkg-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Two builds of the same app: with Node (the default) and with Bun,
      # whose runtime doesn't need libatomic.
      - name: Build the binaries
        env:
          SMITH_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm run build:binary
          npm run build:binary:bun

      - name: Check that they run on RHEL 9
        run: |
          # Node build: needs libatomic.
          docker run --rm -v "$PWD/build/smith:/usr/local/bin/smith:ro" registry.access.redhat.com/ubi9/ubi:latest \
            sh -c 'dnf install -y -q libatomic && smith --version'
          # Bun build: must run on the minimal image with nothing installed.
          docker run --rm -v "$PWD/build/smith-bun:/usr/local/bin/smith:ro" registry.access.redhat.com/ubi9/ubi-minimal:latest \
            smith --version

      - name: Check that the Bun build ignores a project's .env and bunfig.toml
        run: |
          # Bun binaries load both from the current directory unless told not to;
          # for an agent that's the project, and bunfig.toml can preload code.
          dir=$(mktemp -d) && cd "$dir"
          echo "SMITH_BASE_URL=http://should-not-be-used.invalid/v1" > .env
          printf 'preload = ["./preload.ts"]\n' > bunfig.toml
          echo 'require("fs").writeFileSync("PRELOAD-RAN", "")' > preload.ts
          out=$("$GITHUB_WORKSPACE/build/smith-bun" -p hi --model x --sandbox off 2>&1 || true)
          if [ -e PRELOAD-RAN ] || grep -q should-not-be-used <<<"$out"; then
            echo "::error::The Bun binary loaded the project's .env or bunfig.toml"; echo "$out"; exit 1
          fi

      - name: Package
        run: |
          # tar.gz rather than tar.xz: RHEL 9 doesn't install xz by default.
          # Staged in release/, not dist/: dist/ is where `npm run build` puts compiled code.
          # Each archive holds a folder with the binary (always named smith) and the README.
          package() {
            local binary=$1 name=$2
            mkdir -p "release/$name"
            cp "build/$binary" "release/$name/smith"
            cp README.md "release/$name/"
            tar -C release -czf "release/$name.tar.gz" "$name"
            rm -r "release/${name:?}"
            (cd release && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          }
          base="smith-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          package smith "$base"
          package smith-bun "$base-bun"
          ls -l release

      - uses: actions/upload-artifact@v4
        with:
          name: smith-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          # Only the release job below needs them, minutes later; a release keeps
          # its own copy. Kept longer, they fill the account's Actions storage.
          retention-days: 1

  release:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat release/*.sha256 > release/SHA256SUMS
          rm release/*.sha256
          cat > notes.md <<'EOF'
          ## Install

          There are two builds of Smith. Pick one:

          | Archive | Runtime inside | Needs on RHEL 9 |
          |---|---|---|
          | `smith-<version>-linux-x64.tar.gz` | Node.js | `libatomic` (`sudo dnf install libatomic`) |
          | `smith-<version>-linux-x64-bun.tar.gz` | Bun | nothing beyond glibc |

          Download the archive and `SHA256SUMS`, then:

          ```sh
          sha256sum --check --ignore-missing SHA256SUMS
          tar -xzf smith-*-linux-x64*.tar.gz
          sudo install smith-*-linux-x64*/smith /usr/local/bin/
          ```

          Either way, install `bubblewrap` (`sudo dnf install bubblewrap`): shell commands run in
          a sandbox, and Smith won't start without it unless you pass `--sandbox off`.
          EOF
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes
